services:
  # Backend API
  - type: web
    name: jt-express-api
    buildCommand: dotnet publish JTExpress.Api/JTExpress.Api/JTExpress.Api.csproj -c Release -o out
    startCommand: dotnet out/JTExpress.Api.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: jt-express-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: JTExpressApi
      - key: Jwt__Audience
        value: JTExpressWeb

  # Frontend
  - type: web
    name: jt-express-web
    buildCommand: bash build-frontend.sh
    staticPublishPath: ./jt-express-web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://jt-express-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: jt-express-db
    databaseName: jtexpressdb
    user: jtexpressuser